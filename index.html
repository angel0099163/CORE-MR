<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>App VR & Realidade Mista</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        
        /* Câmera de fundo para Realidade Mista */
        #camera-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: none; /* Começa oculta */
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .eye {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 200%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            border: none;
            pointer-events: none;
            background: transparent;
        }

        .right-eye iframe {
            left: -100%;
        }

        /* Menu de Controles Flutuante */
        #ui-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        button {
            background: #00ffcc;
            border: none;
            color: #000;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        button:active {
            background: #00b38f;
        }
    </style>
</head>
<body>

    <!-- Vídeo da Câmera Traseira (Realidade Mista) -->
    <video id="camera-bg" autoplay playsinline muted></video>

    <!-- Tela Dividida VR -->
    <div id="container">
        <div class="eye left-eye">
            <iframe id="frame-left" src="scene.html"></iframe>
        </div>
        <div class="eye right-eye">
            <iframe id="frame-right" src="scene.html"></iframe>
        </div>
    </div>

    <!-- Menu de Opções -->
    <div id="ui-menu">
        <button onclick="toggleMixedReality()">Alternar Realidade Mista</button>
        <button onclick="requestFullscreen()">Tela Cheia</button>
    </div>

    <script>
        let cameraStream = null;
        let mrActive = false;

        // Função para ativar/desativar a Câmera (Realidade Mista)
        async function toggleMixedReality() {
            const videoElement = document.getElementById('camera-bg');
            
            if (!mrActive) {
                try {
                    // Pede acesso à câmera traseira do celular
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: "environment" } }
                    });
                    videoElement.srcObject = cameraStream;
                    videoElement.style.display = 'block';
                    mrActive = true;
                } catch (err) {
                    // Se falhar a traseira exata, tenta qualquer câmera disponível
                    try {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        videoElement.srcObject = cameraStream;
                        videoElement.style.display = 'block';
                        mrActive = true;
                    } catch (e) {
                        alert("Não foi possível acessar a câmera para a Realidade Mista.");
                    }
                }
            } else {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                videoElement.style.display = 'none';
                mrActive = false;
            }
        }

        // Função para colocar o navegador em tela cheia (melhora a experiência no VR Box)
        function requestFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Erro ao tentar tela cheia: ", err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
