<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CORE MR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05050a; font-family: sans-serif; }

        /* TELA INICIAL */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .logo-container { text-align: center; margin-bottom: 40px; }
        .vr-icon { width: 85px; filter: drop-shadow(0 0 10px rgba(0, 170, 255, 0.6)); }
        .logo-text-core { font-size: 45px; font-weight: 900; color: #ffffff; letter-spacing: 3px; }
        .logo-text-mr { font-size: 40px; font-weight: 900; color: #00d2ff; text-shadow: 0 0 15px rgba(0, 210, 255, 0.8); }
        
        .menu-btn {
            width: 80%; max-width: 320px; height: 55px; border-radius: 35px; border: none;
            font-size: 20px; font-weight: bold; cursor: pointer; margin: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-iniciar { background: linear-gradient(135deg, #0070ff, #0042cc); color: #ffffff; }
        .btn-config { background: #ffffff; color: #0b132b; }

        /* TELA DE CONFIGURAÇÕES */
        #config-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 10, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 110; color: white; padding: 20px; text-align: center;
        }
        #config-screen h2 { margin-bottom: 20px; color: #00d2ff; }
        #config-screen p { margin-bottom: 30px; font-size: 14px; color: #aaa; }

        /* AMBIENTE VR / REALIDADE MISTA */
        #vr-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10;
        }
        #camera-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1;
        }
        canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none;
        }
        .vr-divider {
            position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: #111; z-index: 3; pointer-events: none; display: none;
        }
        #sair-btn {
            position: absolute; top: 15px; right: 15px; z-index: 200;
            background: rgba(255, 0, 0, 0.8); color: white; border: none; padding: 8px 16px;
            border-radius: 8px; font-weight: bold; display: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- TELA INICIAL -->
    <div id="menu-screen">
        <div class="logo-container">
            <svg class="vr-icon" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h3l2 4h10l2-4h3a1 1 0 0 1 1 1v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-5a1 1 0 0 1 1-1z"></path>
                <path d="M7 10v2"></path><path d="M17 10v2"></path>
            </svg>
            <div class="logo-text-core">CORE</div>
            <div class="logo-text-mr">MR</div>
        </div>
        <button class="menu-btn btn-iniciar" onclick="iniciarApp()">iniciar</button>
        <button class="menu-btn btn-config" onclick="abrirConfig()">configurações</button>
    </div>

    <!-- CONFIGURAÇÕES -->
    <div id="config-screen">
        <h2>Configurações</h2>
        <p>Modo Realidade Mista e Sensores ativados.</p>
        <button class="menu-btn btn-iniciar" onclick="fecharConfig()">Voltar</button>
    </div>

    <!-- BOTÃO SAIR -->
    <button id="sair-btn" onclick="voltarMenu()">Sair</button>

    <!-- CONTAINER DA REALIDADE MISTA + VR -->
    <div id="vr-wrapper">
        <video id="camera-bg" autoplay playsinline muted></video>
        <div class="vr-divider" id="divider" style="display: block;"></div>
    </div>

    <!-- Importa a biblioteca 3D Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let cameraStream = null;
        let scene, camera, renderer;
        let objects = [];
        let appRunning = false;

        function init3D() {
            if (renderer) return; // Evita duplicar

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const pointLight = new THREE.PointLight(0x00ffcc, 2, 50);
            pointLight.position.set(0, 5, 2);
            scene.add(pointLight);

            // Chão Grid
            const gridHelper = new THREE.GridHelper(30, 30, 0x00ffcc, 0x333333);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // Objetos 3D (Cubo, Esfera, Pirâmide)
            const cube = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.2, metalness: 0.8 }));
            cube.position.set(0, 0, -2);
            scene.add(cube);
            objects.push({ mesh: cube, rx: 0.01, ry: 0.02 });

            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.1 }));
            sphere.position.set(-2, 1, -3);
            scene.add(sphere);
            objects.push({ mesh: sphere, rx: 0.015, ry: 0.015 });

            const pyramid = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1, 4), new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.3 }));
            pyramid.position.set(2, 0.5, -3);
            scene.add(pyramid);
            objects.push({ mesh: pyramid, rx: 0.02, ry: 0.01 });

            // Giroscópio
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.alpha !== null && e.beta !== null && e.gamma !== null) {
                        camera.rotation.x = THREE.MathUtils.degToRad(e.beta - 90);
                        camera.rotation.y = THREE.MathUtils.degToRad(e.gamma);
                    }
                }, true);
            }

            animate();
        }

        function animate() {
            if (!appRunning) return;
            requestAnimationFrame(animate);

            objects.forEach(item => {
                item.mesh.rotation.x += item.rx;
                item.mesh.rotation.y += item.ry;
            });

            renderer.clear();
            let width = window.innerWidth;
            let height = window.innerHeight;
            let halfW = width / 2;

            // Renderiza tela esquerda
            renderer.setViewport(0, 0, halfW, height);
            renderer.setScissor(0, 0, halfW, height);
            renderer.setScissorTest(true);
            renderer.render(scene, camera);

            // Renderiza tela direita
            renderer.setViewport(halfW, 0, halfW, height);
            renderer.setScissor(halfW, 0, halfW, height);
            renderer.setScissorTest(true);
            renderer.render(scene, camera);
        }

        async function iniciarApp() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('vr-wrapper').style.display = 'block';
            document.getElementById('sair-btn').style.display = 'block';
            document.getElementById('divider').style.display = 'block';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {});
            }

            appRunning = true;
            init3D();
            if (renderer) renderer.domElement.style.display = 'block';

            // Ativa Câmera Traseira (Realidade Mista)
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                document.getElementById('camera-bg').srcObject = cameraStream;
            } catch (err) {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('camera-bg').srcObject = cameraStream;
                } catch (e) {
                    console.log("Câmera indisponível.");
                }
            }
        }

        function voltarMenu() {
            appRunning = false;
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            if (renderer) renderer.domElement.style.display = 'none';
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(err => {});
            }
            document.getElementById('vr-wrapper').style.display = 'none';
            document.getElementById('sair-btn').style.display = 'none';
            document.getElementById('divider').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function abrirConfig() { document.getElementById('config-screen').style.display = 'flex'; }
        function fecharConfig() { document.getElementById('config-screen').style.display = 'none'; }
    </script>
</body>
</html>
