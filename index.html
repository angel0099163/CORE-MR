<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Box — Realidade Mista 🥽</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #aviso {
            position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,.75); color: #fff; padding: .7rem 1.2rem; border-radius: .5rem; z-index: 100;
        }
        #botao-vr {
            position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            padding: .8rem 1.8rem; font-size: 1.2rem; border-radius: .6rem; border: none;
            background: #2196F3; color: white; font-weight: bold; cursor: pointer; z-index: 100;
        }
        #botao-vr:disabled { background: #666; }
        #cena { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="aviso">Carregando… Permita câmera/sensores para Realidade Mista</div>
    <canvas id="cena"></canvas>
    <button id="botao-vr">Entrar em VR / RM</button>

    <!-- Bibliotecas externas -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/XRButton.js"></script>

    <script>
        const cena = new THREE.Scene();
        cena.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.6, 0); // Altura dos olhos humanos

        const renderizador = new THREE.WebGLRenderer({ canvas: cena, antialias: true, alpha: true });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.setPixelRatio(window.devicePixelRatio);
        renderizador.xr.enabled = true; // ✅ Ativa suporte nativo a VR/RM

        const aviso = document.getElementById("aviso");
        const botaoVR = document.getElementById("botao-vr");

        // Luzes
        cena.add(new THREE.AmbientLight(0xffffff, 0.6));
        const luz = new THREE.DirectionalLight(0xffffff, 0.9);
        luz.position.set(4, 8, 4);
        cena.add(luz);

        // Chão
        const chao = new THREE.Mesh(
            new THREE.PlaneGeometry(16, 16),
            new THREE.MeshStandardMaterial({color: "#284"})
        );
        chao.rotation.x = -Math.PI/2;
        cena.add(chao);

        // Objetos para VR/Mista
        const cubo = new THREE.Mesh(
            new THREE.BoxGeometry(.8,.8,.8),
            new THREE.MeshStandardMaterial({color: "#f44"})
        );
        cubo.position.set(-1, 1.3, -2);
        cena.add(cubo);

        const esfera = new THREE.Mesh(
            new THREE.SphereGeometry(.5, 32, 32),
            new THREE.MeshStandardMaterial({color: "#4af"})
        );
        esfera.position.set(1, 1.5, -2.2);
        cena.add(esfera);

        // Verifica WebXR e habilita botão oficial
        XRButton.createButton(renderizador)
            .then(botao => {
                botaoVR.replaceWith(botao);
                aviso.textContent = "✅ Pronto! Coloque no VR Box e comece.";
            })
            .catch(e => {
                aviso.textContent = "⚠️ Navegador sem suporte completo a WebXR/RM.";
                botaoVR.disabled = true;
            });

        function animar() {
            renderizador.setAnimationLoop(animar);
            const tempo = performance.now() / 1000;
            cubo.rotation.y = tempo;
            esfera.position.y = 1.5 + Math.sin(tempo * 2) * 0.3;
            renderizador.render(cena, camera);
        }

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        animar();
    </script>
</body>
</html>
