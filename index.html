<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CORE‑MR — VR Box & Realidade Mista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        /* 🖼️ Tela Inicial */
        #tela-inicio {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .logo {
            text-align: center;
            margin-bottom: 60px;
            user-select: none;
        }
        .logo-img {
            font-size: 72px;
            margin-bottom: 8px;
        }
        .logo-texto {
            font-size: 64px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 12px #00a2ff, 0 0 24px #00a2ff;
            letter-spacing: 4px;
        }
        .logo-sub {
            font-size: 56px;
            font-weight: bold;
            color: #00a2ff;
            text-shadow: 0 0 10px #00a2ff;
            margin-top: -12px;
        }
        button {
            width: 75%;
            max-width: 320px;
            padding: 18px;
            margin: 10px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:active { transform: scale(0.96); }
        #btn-iniciar {
            background: #2196ff;
            color: white;
            box-shadow: 0 0 18px rgba(33,150,255,0.6);
        }
        #btn-config {
            background: #000;
            color: #2196ff;
            border: 2px solid #2196ff;
        }

        /* ⚙️ Aviso simples */
        #aviso {
            position: absolute;
            top: 14px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            display: none;
        }

        /* 🎮 Área do jogo/VR */
        #container-vr {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #botao-sair {
            position: absolute;
            top: 12px; right: 12px;
            width: auto;
            padding: 10px 16px;
            font-size: 14px;
            z-index: 150;
            background: rgba(255, 50, 50, 0.85);
            border: none;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 🖼️ Tela igual pediu -->
    <div id="tela-inicio">
        <div class="logo">
            <div class="logo-img">🥽</div>
            <div class="logo-texto">CORE</div>
            <div class="logo-sub">MR</div>
        </div>
        <button id="btn-iniciar">iniciar</button>
        <button id="btn-config">configurações</button>
    </div>

    <div id="aviso"></div>
    <div id="container-vr">
        <canvas id="cena"></canvas>
        <button id="botao-sair">✖ Voltar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const telaInicio = document.getElementById('tela-inicio');
        const containerVR = document.getElementById('container-vr');
        const avisoEl = document.getElementById('aviso');
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnConfig = document.getElementById('btn-config');
        const btnSair = document.getElementById('botao-sair');
        const canvas = document.getElementById('cena');

        let renderizador, cena, camera;

        function prepararCena() {
            cena = new THREE.Scene();
            cena.background = new THREE.Color(0x0f192b);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 1.6, 0);

            renderizador = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderizador.setSize(window.innerWidth, window.innerHeight);
            renderizador.setPixelRatio(window.devicePixelRatio);
            renderizador.xr.enabled = true;

            cena.add(new THREE.AmbientLight(0xffffff, 0.6));
            const luz = new THREE.DirectionalLight('#fff', 0.9);
            luz.position.set(6, 10, 6);
            cena.add(luz);

            const chao = new THREE.Mesh(
                new THREE.PlaneGeometry(16, 16),
                new THREE.MeshStandardMaterial({color: '#1b5e20'})
            );
            chao.rotation.x = -Math.PI / 2;
            cena.add(chao);

            const cubo = new THREE.Mesh(
                new THREE.BoxGeometry(0.75, 0.75, 0.75),
                new THREE.MeshStandardMaterial({color: '#00b0ff', metalness: 0.4})
            );
            cubo.position.set(-1.1, 1.3, -2.3);
            cubo.nome = "cuboAnimado";
            cena.add(cubo);

            const esfera = new THREE.Mesh(
                new THREE.SphereGeometry(0.42, 30, 30),
                new THREE.MeshStandardMaterial({color: '#ff4081'})
            );
            esfera.position.set(1.1, 1.5, -2.4);
            cena.add(esfera);
        }

        // 🚀 Clicou em INICIAR — vai pedir permissão certinho
        btnIniciar.addEventListener('click', async () => {
            avisoEl.style.display = "block";
            avisoEl.textContent = "Solicitando acesso à câmera/sensores...";

            try {
                if (!renderizador) prepararCena();

                // Esconde início, mostra jogo
                telaInicio.style.display = "none";
                containerVR.style.display = "block";

                // Entra em Realidade Mista/VR — sistema pede permissão aqui
                await renderizador.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['bounded-floor', 'hit-test']
                });

                avisoEl.textContent = "✅ Pronto! Coloque no seu VR Box";
                iniciarAnimacao();
            } catch (erro) {
                console.error(erro);
                avisoEl.innerHTML = "⚠️ Permita câmera e atualize Chrome/ARCore se aparecer erro!";
                telaInicio.style.display = "flex";
                containerVR.style.display = "none";
            }
        });

        // ⚙️ Configurações — pode expandir depois
        btnConfig.addEventListener('click', () => {
            alert("🛠️ Configurações:\n\n• Certifique-se de usar HTTPS\n• Ative Câmera e Sensores\n• Atualize Chrome e ARCore\n• Use navegador compatível com WebXR");
        });

        // ↩️ Voltar para tela inicial
        btnSair.addEventListener('click', async () => {
            if (renderizador && renderizador.xr.isPresenting) {
                const sessao = await renderizador.xr.getSession();
                if (sessao) await sessao.end();
            }
            containerVR.style.display = "none";
            telaInicio.style.display = "flex";
            avisoEl.style.display = "none";
        });

        function iniciarAnimacao() {
            function loop() {
                renderizador.setAnimationLoop(loop);
                const tempo = performance.now() / 1000;

                cena.children.forEach(obj => {
                    if (obj.nome === "cuboAnimado") {
                        obj.rotation.y = tempo;
                        obj.position.y = 1.3 + Math.sin(tempo * 1.6) * 0.22;
                    }
                });

                renderizador.render(cena, camera);
            }
            loop();
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderizador) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
