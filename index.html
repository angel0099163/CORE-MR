<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CORE‑MR — VR Box & Realidade Mista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        /* Tela inicial igual sua imagem */
        #tela-inicio {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .logo {
            text-align: center;
            margin-bottom: 60px;
        }
        .logo-img { font-size: 80px; margin-bottom: 8px; }
        .logo-texto {
            font-size: 66px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 12px #00a2ff, 0 0 24px #00a2ff;
            letter-spacing: 4px;
        }
        .logo-sub {
            font-size: 58px;
            font-weight: bold;
            color: #00a2ff;
            text-shadow: 0 0 10px #00a2ff;
            margin-top: -12px;
        }
        button {
            width: 75%;
            max-width: 320px;
            padding: 18px;
            margin: 10px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.96); }
        #btn-iniciar {
            background: #2196ff;
            color: white;
            box-shadow: 0 0 18px rgba(33,150,255,0.6);
        }
        #btn-config {
            background: transparent;
            color: #2196ff;
            border: 2px solid #2196ff;
        }

        #aviso {
            position: absolute;
            top: 14px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            display: none;
        }

        #container-vr {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #botao-sair {
            position: absolute;
            top: 12px; right: 12px;
            padding: 10px 18px;
            font-size: 14px;
            background: rgba(220, 40, 40, 0.85);
            border: none; border-radius: 8px;
            color: #fff; z-index: 150;
        }
    </style>
</head>
<body>
    <div id="tela-inicio">
        <div class="logo">
            <div class="logo-img">🥽</div>
            <div class="logo-texto">CORE</div>
            <div class="logo-sub">MR</div>
        </div>
        <button id="btn-iniciar">iniciar</button>
        <button id="btn-config">configurações</button>
    </div>

    <div id="aviso"></div>
    <div id="container-vr">
        <canvas id="cena"></canvas>
        <button id="botao-sair">✖ Voltar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const telaInicio = document.getElementById('tela-inicio');
        const containerVR = document.getElementById('container-vr');
        const avisoEl = document.getElementById('aviso');
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnConfig = document.getElementById('btn-config');
        const btnSair = document.getElementById('botao-sair');
        const canvas = document.getElementById('cena');

        let renderizador, cena, camera;

        function prepararAmbiente() {
            cena = new THREE.Scene();
            cena.background = new THREE.Color(0x0b1020);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 1.6, 0);

            renderizador = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderizador.setSize(window.innerWidth, window.innerHeight);
            renderizador.setPixelRatio(window.devicePixelRatio);
            renderizador.xr.enabled = true;

            cena.add(new THREE.AmbientLight(0xffffff, 0.6));
            const luz = new THREE.DirectionalLight('#ffffff', 0.9);
            luz.position.set(5, 10, 5);
            cena.add(luz);

            const chao = new THREE.Mesh(
                new THREE.PlaneGeometry(16, 16),
                new THREE.MeshStandardMaterial({color: '#207520'})
            );
            chao.rotation.x = -Math.PI / 2;
            cena.add(chao);

            const cubo = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.MeshStandardMaterial({color: '#00b8ff', metalness: 0.35})
            );
            cubo.position.set(-1.2, 1.3, -2.2);
            cubo.userData.tipo = "animado";
            cena.add(cubo);

            const esfera = new THREE.Mesh(
                new THREE.SphereGeometry(0.45, 32, 32),
                new THREE.MeshStandardMaterial({color: '#ff4488'})
            );
            esfera.position.set(1.2, 1.5, -2.4);
            cena.add(esfera);
        }

        btnIniciar.addEventListener('click', async () => {
            avisoEl.style.display = "block";
            avisoEl.textContent = "Solicitando câmera/sensores...";
            try {
                if (!renderizador) prepararAmbiente();
                telaInicio.style.display = "none";
                containerVR.style.display = "block";

                await renderizador.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['hit-test', 'bounded-floor']
                });

                avisoEl.textContent = "✅ Pronto! Coloque no seu VR Box";
                animarCena();
            } catch (e) {
                console.error(e);
                avisoEl.innerHTML = "⚠️ Permita câmera ou instale/atualize ARCore/Chrome!";
                telaInicio.style.display = "flex";
                containerVR.style.display = "none";
            }
        });

        btnConfig.addEventListener('click', () => {
            alert("⚙️ Configurações:\n• Use conexão segura\n• Permita Câmera e Sensores\n• Atualize Chrome e Serviços ARCore\n• GitHub Pages funciona bem");
        });

        btnSair.addEventListener('click', async () => {
            if (renderizador?.xr?.isPresenting) {
                const sessao = await renderizador.xr.getSession();
                sessao?.end();
            }
            containerVR.style.display = "none";
            telaInicio.style.display = "flex";
            avisoEl.style.display = "none";
        });

        function animarCena() {
            function loop() {
                renderizador.setAnimationLoop(loop);
                const tempo = performance.now() / 1000;
                cena.children.forEach(obj => {
                    if (obj.userData.tipo === "animado") {
                        obj.rotation.y = tempo;
                        obj.position.y = 1.3 + Math.sin(tempo * 1.7) * 0.25;
                    }
                });
                renderizador.render(cena, camera);
            }
            loop();
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderizador) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
