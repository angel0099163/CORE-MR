<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VR Box — Realidade Mista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
        }
        #btn-vr {
            position: absolute;
            bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            padding: 15px 32px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #2196F3;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="info">Aperte o botão → permita câmera/sensores quando aparecer</div>
    <canvas id="tela"></canvas>
    <button id="btn-vr">Entrar em VR / RM</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        const infoEl = document.getElementById('info');
        const botaoEl = document.getElementById('btn-vr');
        const telaEl = document.getElementById('tela');

        // Cena básica e confiável
        const cena = new THREE.Scene();
        cena.background = new THREE.Color(0x88CCEE);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 40);
        camera.position.set(0, 1.6, 0);

        const renderizador = new THREE.WebGLRenderer({ canvas: telaEl, antialias: true, alpha: true });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.setPixelRatio(window.devicePixelRatio);
        renderizador.xr.enabled = true; // Ativa WebXR corretamente

        // Luz e objetos simples
        cena.add(new THREE.AmbientLight(0xffffff, 0.65));
        const luz = new THREE.DirectionalLight(0xffffff, 0.85);
        luz.position.set(4, 8, 4);
        cena.add(luz);

        // Chão
        const chao = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 14),
            new THREE.MeshStandardMaterial({color: '#2a7d2a'})
        );
        chao.rotation.x = -Math.PI / 2;
        cena.add(chao);

        // Objeto visual
        const forma = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({color: '#ff4466'})
        );
        forma.position.set(0, 1.3, -2.2);
        cena.add(forma);

        // ✅ Pedido claro ao clicar — sem armadilhas externas
        botaoEl.addEventListener('click', async () => {
            try {
                infoEl.textContent = "Solicitando acesso... permita quando aparecer!";
                if (!renderizador.xr.isPresenting) {
                    await renderizador.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['local-floor'],
                        optionalFeatures: ['bounded-floor', 'hit-test']
                    });
                    infoEl.textContent = "✅ Modo Realidade Mista ativo! Coloque no VR Box 🥽";
                    botaoEl.style.display = 'none';
                }
            } catch (erro) {
                console.error(erro);
                infoEl.innerHTML = "⚠️ Não foi possível iniciar — verifique câmera, ARCore ou use navegador compatível";
            }
        });

        // Loop suave
        function animar() {
            renderizador.setAnimationLoop(animar);
            const tempo = performance.now() / 1000;
            forma.rotation.y = tempo;
            forma.position.y = 1.3 + Math.sin(tempo * 1.5) * 0.25;
            renderizador.render(cena, camera);
        }

        // Ajusta tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        animar();
    </script>
</body>
</html>
