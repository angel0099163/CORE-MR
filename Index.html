<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE MR - Realidade Mista</title>
    <!-- A-Frame para o ambiente 3D/VR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- Biblioteca de Gestos/Mãos para Web -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
    <style>
        body { margin: 0; background-color: #000; font-family: sans-serif; }
        /* Estilo da Tela Inicial em Overlay HTML (mais preciso para 3DOF mobile) */
        #ui-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-title {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .logo-sub {
            color: #00bfff;
            font-size: 42px;
            font-weight: 900;
        }
        .menu-btn {
            width: 280px;
            padding: 18px;
            margin: 10px;
            border-radius: 35px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-iniciar {
            background-color: #0055ff;
            color: white;
        }
        .btn-config {
            background-color: #ffffff;
            color: #002266;
        }
    </style>
</head>
<body>

    <!-- MENU INICIAL (Baseado na sua imagem 1) -->
    <div id="ui-menu">
        <div class="logo-container">
            <!-- Ícone/Simulação do Headset -->
            <svg width="80" height="50" viewBox="0 0 24 24" fill="#00bfff"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,12A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg>
            <div class="logo-title">CORE</div>
            <div class="logo-sub">MR</div>
        </div>
        <button class="menu-btn btn-iniciar" onclick="iniciarApp()">iniciar</button>
        <button class="menu-btn btn-config" onclick="abrirConfig()">configurações</button>
    </div>

    <!-- AMBIENTE 3D / REALIDADE MISTA (3DOF) -->
    <a-scene embedded vr-mode-ui="enabled: true">
        
        <!-- Câmera 3DOF com Mira/Cursor para seleção por olhar ou toque simulado de mão -->
        <a-camera position="0 1.6 0">
            <a-cursor color="#00bfff" fuse="true" fuse-timeout="1000"
                      geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                      material="shader: flat">
            </a-cursor>
        </a-camera>

        <!-- Luzes -->
        <a-light type="ambient" color="#FFF"></a-light>
        <a-light type="directional" color="#00bfff" position="2 4 2"></a-light>

        <!-- Cenário Estilo Painel Flutuante (Inspirado na sua imagem 2 de HUD) -->
        <a-entity id="hud-space" visible="false">
            <!-- Tela Central Curva / Painel Principal -->
            <a-plane position="0 1.6 -2.5" width="3" height="1.8" color="#1a1a1a" opacity="0.8" material="side: double">
                <a-text value="PAINEL PRINCIPAL - CORE MR" position="-1.2 0.7 0.01" color="#00bfff" width="4"></a-text>
            </a-plane>
            
            <!-- Barra de Atalhos Inferior (Estilo Imagem 2) -->
            <a-entity position="0 0.8 -2">
                <a-box position="-0.9 0 0" width="0.2" height="0.1" depth="0.05" color="#333"></a-box>
                <a-box position="-0.6 0 0" width="0.2" height="0.1" depth="0.05" color="#333"></a-box>
                <a-box position="-0.3 0 0" width="0.2" height="0.1" depth="0.05" color="#333"></a-box>
                <a-box position="0 0 0" width="0.2" height="0.1" depth="0.05" color="#0055ff"></a-box>
                <a-box position="0.3 0 0" width="0.2" height="0.1" depth="0.05" color="#333"></a-box>
                <a-box position="0.6 0 0" width="0.2" height="0.1" depth="0.05" color="#333"></a-box>
                <a-box position="0.9 0 0" width="0.2" height="0.1" depth="0.05" color="#333"></a-box>
            </a-entity>
        </a-entity>

        <!-- Fundo Estrelado/Espacial -->
        <a-sky color="#05050a"></a-sky>
    </a-scene>

    <script>
        // Função para transição da Tela Inicial para o Ambiente MR
        function iniciarApp() {
            const menu = document.getElementById('ui-menu');
            menu.style.opacity = '0';
            setTimeout(() => {
                menu.style.display = 'none';
                // Mostra o HUD 3D no espaço
                document.getElementById('hud-space').setAttribute('visible', 'true');
            }, 500);
        }

        function abrirConfig() {
            alert("Painel de Configurações do CORE MR ativado!");
        }
    </script>
</body>
</html>
