<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MR Hand Tracking - VR Box</title>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            background: #000; width: 100%; height: 100%;
        }
        #container {
            display: flex; width: 100%; height: 100%;
        }
        .eye {
            flex: 1; width: 50%; height: 100%;
            position: relative; overflow: hidden;
            border-right: 2px solid #111;
        }
        /* O vídeo da câmera e o canvas do esqueleto ficam sobrepostos em cada olho */
        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            transform: scaleX(-1); /* Efeito espelho natural */
        }
    </style>

    <!-- Importando as bibliotecas do Google MediaPipe via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="container">
        <!-- OLHO ESQUERDO -->
        <div class="eye">
            <video id="video-input" autoplay playsinline></video>
            <canvas id="canvas-left"></canvas>
        </div>
        <!-- OLHO DIREITO -->
        <div class="eye">
            <!-- Espelha o mesmo vídeo e desenha o esqueleto correspondente -->
            <video id="video-clone" autoplay playsinline style="display:none;"></video>
            <canvas id="canvas-right"></canvas>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-input');
        const canvasLeft = document.getElementById('canvas-left');
        const ctxLeft = canvasLeft.getContext('2d');
        
        const canvasRight = document.getElementById('canvas-right');
        const ctxRight = canvasRight.getContext('2d');

        function onResults(results) {
            // Ajusta dimensões dos canvas conforme a resolução real da câmera
            if (canvasLeft.width !== videoElement.videoWidth) {
                canvasLeft.width = videoElement.videoWidth;
                canvasLeft.height = videoElement.videoHeight;
                canvasRight.width = videoElement.videoWidth;
                canvasRight.height = videoElement.videoHeight;
            }

            // Limpa os quadros anteriores
            ctxLeft.save();
            ctxLeft.clearRect(0, 0, canvasLeft.width, canvasLeft.height);
            ctxLeft.drawImage(results.image, 0, 0, canvasLeft.width, canvasLeft.height);

            ctxRight.save();
            ctxRight.clearRect(0, 0, canvasRight.width, canvasRight.height);
            ctxRight.drawImage(results.image, 0, 0, canvasRight.width, canvasRight.height);

            // Se encontrar mãos, desenha o esqueleto estrutural em ambos os "olhos"
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Desenho no Olho Esquerdo
                    drawConnectors(ctxLeft, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                    drawLandmarks(ctxLeft, landmarks, {color: '#FF0000', lineWidth: 2, radius: 3});

                    // Desenho no Olho Direito (Criando a estereoscopia de realidade mista)
                    drawConnectors(ctxRight, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                    drawLandmarks(ctxRight, landmarks, {color: '#FF0000', lineWidth: 2, radius: 3});
                }
            }
            ctxLeft.restore();
            ctxRight.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Inicializa a câmera traseira do celular
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            facingMode: 'environment', // Câmera traseira para Realidade Mista
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            alert("Erro ao acessar a câmera. Certifique-se de usar HTTPS no GitHub Pages!");
        });
    </script>
</body>
</html>
