<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🥽 VR Box — Realidade Mista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }
        #aviso {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,.78);
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            z-index: 100;
        }
        #botao-vr {
            position: absolute;
            bottom: 22px; left: 50%;
            transform: translateX(-50%);
            border: none;
            border-radius: 10px;
            padding: 14px 30px;
            font-size: 18px;
            background: #2196F3;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }
        #botao-vr:disabled { background: #555; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="aviso">Carregando — permita câmera/sensores para Realidade Mista 📱</div>
    <canvas id="cena"></canvas>
    <button id="botao-vr">Entrar em VR / Mista</button>

    <!-- Bibliotecas prontas -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/XRButton.js"></script>

    <script>
        const cena = new THREE.Scene();
        cena.background = new THREE.Color(0x87CEEB); // Céu claro

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.6, 0); // Altura real dos olhos

        const renderizador = new THREE.WebGLRenderer({ canvas: cena, antialias: true, alpha: true });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.setPixelRatio(window.devicePixelRatio);
        renderizador.xr.enabled = true; // Ativa VR/RM oficial

        const avisoEl = document.getElementById('aviso');
        const btnVrEl = document.getElementById('botao-vr');

        // Luzes do ambiente
        cena.add(new THREE.AmbientLight(0xffffff, 0.6));
        const luzForte = new THREE.DirectionalLight('#fff', 0.9);
        luzForte.position.set(5, 10, 5);
        cena.add(luzForte);

        // Chão
        const chao = new THREE.Mesh(
            new THREE.PlaneGeometry(18, 18),
            new THREE.MeshStandardMaterial({ color: '#2c6e2c' })
        );
        chao.rotation.x = -Math.PI / 2;
        cena.add(chao);

        // Objetos 3D para ver sobre o mundo real
        const cubo = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: '#ff4444' })
        );
        cubo.position.set(-1.2, 1.3, -2.2);
        cena.add(cubo);

        const esfera = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 32, 32),
            new THREE.MeshStandardMaterial({ color: '#44aaff' })
        );
        esfera.position.set(1.2, 1.4, -2.5);
        cena.add(esfera);

        // Verifica suporte e troca pelo botão nativo de VR
        XRButton.createButton(renderizador)
            .then(botao => {
                btnVrEl.replaceWith(botao);
                avisoEl.textContent = "✅ Pronto! Coloque no VR Box e aproveite!";
            })
            .catch(() => {
                avisoEl.textContent = "⚠️ Navegador não suporta Realidade Mista completa.";
                btnVrEl.disabled = true;
            });

        // Animação contínua
        function loop() {
            renderizador.setAnimationLoop(loop);
            const tempo = performance.now() / 1000;
            cubo.rotation.y = tempo;
            esfera.position.y = 1.4 + Math.sin(tempo * 2) * 0.28;
            renderizador.render(cena, camera);
        }

        // Ajusta se girar a tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        loop();
    </script>
</body>
</html>
